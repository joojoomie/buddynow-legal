<svg xmlns="http://www.w3.org/2000/svg" width="460" height="360" viewBox="0 0 46 36">
  <!-- Canonical BuddyNow twin-buddy mascot. Single source of truth for the
       in-app SVG (components/BrandLockup.tsx), the app icon, and exported
       logos. Geometry: left buddy tilted -30°, right +30° (≈60° splay between
       them); dot eyes; gentle smile; ONE soft pink blush per buddy on the
       cheek beside the smile (clear of the mouth). Centers 13.5/32.5 leave
       only a ~1–2px gap at the narrowest point, so the beans nearly touch in
       the middle while splaying apart. Keep this and BrandLockup in sync —
       no translate offset, identical to BrandLockup's render. -->
  <!-- Left buddy — deeper olive. -->
  <g transform="rotate(-30 13.5 18)">
    <ellipse cx="13.5" cy="18" rx="8.5" ry="12" fill="#97C459"/>
    <ellipse cx="9" cy="19.6" rx="1.6" ry="1" fill="#F58BA8" opacity="0.7"/>
    <circle cx="11" cy="16" r="1.3" fill="#173404"/>
    <circle cx="15.5" cy="17" r="1.3" fill="#173404"/>
    <path d="M 10.8 19.2 Q 13.5 21 16.2 19.2" stroke="#173404" stroke-width="1.1" fill="none" stroke-linecap="round"/>
  </g>
  <!-- Right buddy — pale green. -->
  <g transform="rotate(30 32.5 18)">
    <ellipse cx="32.5" cy="18" rx="8.5" ry="12" fill="#C0DD97"/>
    <ellipse cx="37" cy="19.6" rx="1.6" ry="1" fill="#F58BA8" opacity="0.7"/>
    <circle cx="30" cy="17" r="1.3" fill="#173404"/>
    <circle cx="34.5" cy="16" r="1.3" fill="#173404"/>
    <path d="M 29.8 19.2 Q 32.5 21 35.2 19.2" stroke="#173404" stroke-width="1.1" fill="none" stroke-linecap="round"/>
  </g>
</svg>
